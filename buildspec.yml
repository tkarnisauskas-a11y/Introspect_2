version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      # Optional: Login to Docker Hub if using Docker Hub images
      # - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
      - echo Upgrading AWS CLI to fix boto3 compatibility...
      - pip install --upgrade awscli boto3 botocore
      - echo Checking build environment architecture...
      - uname -m
      - docker version
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
  build:
    commands:
      - echo Build started on `date`
      - echo Installing dependencies...
      - pip install -r requirements.txt
      - echo Running tests...
      - python -m pytest tests/ || echo "Tests failed but continuing build"
      - echo Building the Docker image...
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo Creating deployment artifacts...
      - sed -i "s|claims-api:latest|$REPOSITORY_URI:$IMAGE_TAG|g" k8s/deployment.yaml
      - printf '{"imageUri":"%s","imageTag":"%s"}' $REPOSITORY_URI:$IMAGE_TAG $IMAGE_TAG > imageDetail.json
      - echo Packaging CodeDeploy artifacts...
      - mkdir -p artifacts
      - cp appspec.yml artifacts/
      - cp -r k8s/ artifacts/
      - cp -r scripts/ artifacts/
      - cp imageDetail.json artifacts/
      - cd artifacts && zip -r ../codedeploy-package.zip . && cd ..
      - echo CodeDeploy package created successfully
artifacts:
  files:
    - k8s/**/*
    - scripts/**/*
    - imageDetail.json
    - appspec.yml