AWSTemplateFormatVersion: '2010-09-09'
Description: 'API Gateway with VPC Link for EKS integration'

Parameters:
  VpcStackName:
    Type: String
    Default: claims-vpc
  LoadBalancerArn:
    Type: String
    Description: ARN of the Network Load Balancer in EKS cluster

Resources:
  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: claims-vpc-link
      SubnetIds: !Split
        - ','
        - !ImportValue
            Fn::Sub: '${VpcStackName}-PrivateSubnets'
      Tags:
        Environment: production
        Application: claims-api

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: claims-api-gateway
      Description: API Gateway for Claims API
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - '*'

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      IntegrationUri: !Sub 'http://${LoadBalancerArn}'
      PayloadFormatVersion: '1.0'

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'ANY /{proxy+}'
      Target: !Sub 'integrations/${Integration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: prod
      AutoDeploy: true

Outputs:
  ApiGatewayUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayUrl'
  
  VpcLinkId:
    Description: VPC Link ID
    Value: !Ref VpcLink
    Export:
      Name: !Sub '${AWS::StackName}-VpcLinkId'