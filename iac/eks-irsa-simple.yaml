AWSTemplateFormatVersion: '2010-09-09'
Description: 'Simple IAM Role for EKS Service Account to access DynamoDB'

Resources:
  ClaimsAPIServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ClaimsAPI-EKS-ServiceRole-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.us-east-1.amazonaws.com/id/606AEA60C4C3521AC4A53BF38C41AE49'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.eks.us-east-1.amazonaws.com/id/606AEA60C4C3521AC4A53BF38C41AE49:sub': 'system:serviceaccount:default:claims-api-sa'
                'oidc.eks.us-east-1.amazonaws.com/id/606AEA60C4C3521AC4A53BF38C41AE49:aud': 'sts.amazonaws.com'
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: 
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/claims'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/claims/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::claim-notes-${AWS::AccountId}-${AWS::Region}/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'

Outputs:
  ServiceRoleArn:
    Description: ARN of the service role
    Value: !GetAtt ClaimsAPIServiceRole.Arn