AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Role for EKS Service Account to access DynamoDB'

Parameters:
  EKSClusterName:
    Type: String
    Default: introspect-2-cluster
  
  ServiceAccountName:
    Type: String
    Default: claims-api-sa

Resources:
  # IAM Role for Service Account
  ClaimsAPIServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ClaimsAPI-EKS-ServiceRole-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSClusterOIDC}'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.eks.us-east-1.amazonaws.com/id/PLACEHOLDER:sub': !Sub 'system:serviceaccount:default:${ServiceAccountName}'
                'oidc.eks.us-east-1.amazonaws.com/id/PLACEHOLDER:aud': 'sts.amazonaws.com'
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: 
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/claims'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/claims/*'

  # Get EKS Cluster OIDC Issuer
  EKSClusterOIDC:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt GetOIDCFunction.Arn
      ClusterName: !Ref EKSClusterName

  GetOIDCFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.9
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
              try:
                  eks = boto3.client('eks')
                  cluster = eks.describe_cluster(name=event['ResourceProperties']['ClusterName'])
                  oidc_issuer = cluster['cluster']['identity']['oidc']['issuer']
                  oidc_id = oidc_issuer.split('/')[-1]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'OIDCId': oidc_id})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EKSDescribe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: '*'

Outputs:
  ServiceRoleArn:
    Description: ARN of the service role
    Value: !GetAtt ClaimsAPIServiceRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ServiceRoleArn'