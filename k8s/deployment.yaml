apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      containers:
      - name: claims-api
        image: claims-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: AWS_REGION
          value: "us-east-1"
        - name: DYNAMODB_TABLE_NAME
          value: "claims"