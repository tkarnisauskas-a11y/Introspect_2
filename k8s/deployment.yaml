apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
  namespace: default
  labels:
    app: claims-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      serviceAccountName: claims-api-sa
      containers:
      - name: introspect2-claims-api
        image: 621262609834.dkr.ecr.us-east-1.amazonaws.com/introspect2-claims-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: AWS_REGION
          value: "us-east-1"
        - name: DYNAMODB_TABLE_NAME
          value: "claims"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5